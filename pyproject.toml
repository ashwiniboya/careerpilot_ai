[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot_ai"
version = "0.1.0"
description = "An autonomous multi-agent career co-pilot."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "chromadb>=0.4.0",
    "mcp>=1.0.0",
    "google-adk>=0.0.1",
    "google-genai>=0.1.0",
    "google-generativeai>=0.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "pypdf>=3.9.0",
    "python-docx>=0.8.11",
    "loguru>=0.7.0",
    "httpx>=0.24.0",
    "websockets>=11.0.0",
    "python-multipart>=0.0.6"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
